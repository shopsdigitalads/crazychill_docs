<script>
const pages = [
{title:"Cover",cover:true,body:`<div><div class="eyebrow">Product requirements document · Version 1.0</div><h1>CrazyChill<span>.in</span></h1><div class="subtitle">A local-first e-commerce marketplace for discovering, buying and selling products — starting in Nagpur and expanding regionally.</div></div><div class="cover-mark">CC</div><div class="cover-meta"><div><strong>Document</strong>Project Requirement Document</div><div><strong>Release scope</strong>Version 1 (V1)</div><div><strong>Prepared</strong>30 October 2026</div><div><strong>Status</strong>Working baseline — validate open decisions</div></div>`},
{title:"Document control",body:`<div class="kicker">01 · Document control</div><h2>How to use this book</h2><p class="lead">This document captures the currently established product requirements and implementation direction for CrazyChill.in. It is intended to guide product decisions, development, QA and release planning.</p><div class="grid"><div class="tile"><b>Product</b><p>CrazyChill.in — local-first e-commerce marketplace</p></div><div class="tile"><b>Primary launch market</b><p>Nagpur, Maharashtra, with regional expansion in mind</p></div><div class="tile"><b>Current release</b><p>V1: single-seller operating model controlled by the platform</p></div><div class="tile"><b>Future direction</b><p>Multi-vendor capability, controlled by an admin setting when ready</p></div></div><h3>Document conventions</h3><ul><li><b>Must:</b> required for V1 release or explicitly agreed policy.</li><li><b>Should:</b> strongly recommended, but can be phased with approval.</li><li><b>Future:</b> intentionally outside V1 unless promoted through change control.</li></ul><div class="callout"><b>Important:</b> This is a consolidated baseline from requirements discussed so far, not a substitute for final business, legal, tax or payment-provider approval. Items marked “confirm” need an explicit decision before implementation.</div>`},
{title:"Index & product overview",body:`<div class="kicker">02 · Product overview</div><h2>Purpose and navigation</h2><p>CrazyChill.in aims to make local and regional commerce easier by bringing product discovery, seller-managed listings, checkout, payments, delivery and post-order tracking into one platform.</p><h3>Book index</h3><div class="grid"><div class="tile"><b>03 — Vision & goals</b><p>Problem, outcomes and success measures</p></div><div class="tile"><b>04 — Scope</b><p>V1 inclusions, exclusions and assumptions</p></div><div class="tile"><b>05 — Users & roles</b><p>Customer, seller, admin and permissions</p></div><div class="tile"><b>06 — Catalogue & categories</b><p>Taxonomy, shared catalogue and attributes</p></div><div class="tile"><b>07 — Seller management</b><p>Verification, onboarding and account control</p></div><div class="tile"><b>08 — Product listings</b><p>Approval, variants, stock and SKU rules</p></div><div class="tile"><b>09 — Shopping experience</b><p>Search, product page, cart and wishlist</p></div><div class="tile"><b>10 — Checkout & payments</b><p>Razorpay, COD and fee calculations</p></div><div class="tile"><b>11 — Orders & fulfilment</b><p>Order lifecycle and shipment options</p></div><div class="tile"><b>12 — Referral & wallet</b><p>Attribution, earning and withdrawals</p></div><div class="tile"><b>13 — Invoices & finance</b><p>GST invoices, fees and records</p></div><div class="tile"><b>14–20 — Platform</b><p>Admin, architecture, data, APIs, security, QA and roadmap</p></div></div>`},
{title:"Vision & goals",body:`<div class="kicker">03 · Vision & goals</div><h2>What we are building</h2><p class="lead">A dependable marketplace that helps customers discover useful products from local and regional sellers, while giving the platform clear control over catalogue quality, seller trust, payments and fulfilment.</p><h3>Business goals</h3><ul><li>Enable local sellers to reach online customers without building their own e-commerce stack.</li><li>Offer customers a consistent shopping, payment and delivery experience.</li><li>Maintain catalogue quality through category controls and product/listing moderation.</li><li>Build a platform foundation that can support multi-vendor operations later.</li><li>Support configurable platform fees, referral incentives and delivery modes.</li></ul><h3>Product principles</h3><div class="grid"><div class="tile"><b>Trust before scale</b><p>Verify sellers and moderate new catalogue products and seller listings.</p></div><div class="tile"><b>One source of truth</b><p>Keep shared catalogue information separate from seller-specific price, SKU and inventory.</p></div><div class="tile"><b>Configurable operations</b><p>Use admin settings for fees, COD, delivery modes and policy thresholds.</p></div><div class="tile"><b>Traceable transactions</b><p>Record payment, order, shipment, refund and wallet events for auditability.</p></div></div><h3>Suggested V1 success measures</h3><p>Track verified sellers, approved active listings, product-to-cart rate, checkout completion, successful payment rate, dispatch time, delivery success, cancellation/return rate and repeat purchase rate. Set numerical targets after baseline data is available.</p>`},
{title:"Scope & assumptions",body:`<div class="kicker">04 · Scope</div><h2>V1 boundaries</h2><h3>Included in V1</h3><ul><li>Customer-facing marketplace: home, category browsing, product details, search, cart, wishlist and checkout.</li><li>Admin-controlled seller creation/activation and seller verification records.</li><li>Admin-approved active categories and a moderated shared product catalogue.</li><li>Seller-specific listing, pricing, SKU, inventory and listing approval.</li><li>Order management, Razorpay payment integration and configurable COD.</li><li>Shipment creation through Shiprocket or manual seller/courier workflow.</li><li>Referral attribution, wallet ledger and withdrawal requests according to approved policy.</li><li>Invoice generation and configurable platform/delivery fee rules.</li><li>Admin settings, reporting, logs and operational controls.</li></ul><h3>Not included / future scope</h3><ul><li>Open self-service seller registration without admin control.</li><li>Fully enabled multi-vendor marketplace operations at launch.</li><li>Automatic approval for every seller/listing by default.</li><li>Native iOS/Android apps unless separately approved; V1 web scope is assumed.</li><li>Automated integrations with every courier; Shiprocket plus manual mode are the initial options.</li></ul><div class="note"><b>Assumption to confirm:</b> The current operating model is platform-managed/single-seller for V1, while the database and code should avoid blocking a later multi-vendor switch.</div>`},
{title:"Users & roles",body:`<div class="kicker">05 · Users & access</div><h2>Roles and responsibilities</h2><table><tr><th>Role</th><th>Main capabilities</th><th>Restrictions</th></tr><tr><td><b>Super Admin</b></td><td>Full configuration, user/role control, approvals, finance, orders, reports and audit access.</td><td>Protect with mandatory two-factor authentication.</td></tr><tr><td><b>Sub Admin</b></td><td>Operational access based on assigned permissions: catalogue, sellers, orders or support.</td><td>No access beyond explicitly granted permissions.</td></tr><tr><td><b>Customer</b></td><td>Browse, register/login, manage profile/addresses, cart, wishlist, orders, referrals and wallet where eligible.</td><td>Only their own personal and transaction data.</td></tr><tr><td><b>Seller</b></td><td>Manage approved listings, stock, order processing and shipment details.</td><td>Account activation and category access are admin-controlled.</td></tr></table><h3>Authentication requirements</h3><ul><li>Customer/seller login supports mobile OTP; email is captured as an account field where required.</li><li>Admin authentication must enforce two-factor authentication.</li><li>Role checks must be enforced server-side through middleware/policies, not just hidden UI elements.</li><li>Track account active/inactive status, verification timestamps and last-login metadata.</li></ul><div class="callout">Seller account creation is controlled by Admin in V1. Do not expose an unrestricted public seller registration flow unless this policy is changed.</div>`},
{title:"Catalogue & categories",body:`<div class="kicker">06 · Catalogue</div><h2>Category and product catalogue</h2><p>The platform maintains a shared catalogue so that the same underlying product is not recreated for every seller. Sellers attach their own listing to an approved catalogue product.</p><h3>V1 approved category set</h3><ol><li>Clothing</li><li>Textiles & Handicrafts</li><li>Electronics & Mobile Accessories</li><li>Fashion & Accessories</li><li>Beauty & Personal Care</li><li>Books</li><li>Stationery & Office Supplies</li><li>Sports & Outdoor</li><li>Jewellery & Watches</li><li>Footwear & Bags</li><li>Tools & Hardware</li></ol><h3>Category controls</h3><ul><li>Only active, admin-approved categories are selectable by sellers.</li><li>Categories may have parent/child hierarchy, slug, description, image, status and sort order.</li><li>Category-specific attributes should be configurable rather than hard-coded into one generic form.</li><li>Attribute values may be text, number, boolean, select or multi-select, as appropriate.</li></ul><div class="note"><b>Data design:</b> Use category attributes and attribute values (or equivalent normalized structures) so filters and product specifications can evolve without adding columns for every category.</div>`},
{title:"Seller onboarding",body:`<div class="kicker">07 · Seller management</div><h2>Seller verification & activation</h2><p>Seller records are created or activated by Admin. Verification documents and bank details must be stored securely and made available only to authorized roles.</p><h3>Required seller information</h3><ul><li>Shop/business name and contact details.</li><li>Shop licence or applicable business proof.</li><li>GST certificate/details, where applicable.</li><li>Aadhaar and PAN verification details/documents as required by the approved process.</li><li>Bank account holder name, account details and IFSC for settlement/withdrawal workflows.</li><li>Seller address and pickup/dispatch address.</li></ul><h3>Seller lifecycle</h3><p><span class="tag">Created</span> <span class="tag">Documents pending</span> <span class="tag">Under review</span> <span class="tag">Verified</span> <span class="tag">Active</span> <span class="tag">Suspended</span> <span class="tag">Rejected</span></p><ul><li>Admin reviews documents and records approval/rejection with reason and timestamp.</li><li>Only active sellers can create/manage listings and fulfil orders.</li><li>Suspension must block new sales and preserve historical order/financial records.</li><li>Changes to bank or legal details should be logged and may require re-verification.</li></ul><div class="callout">Security and compliance decision: confirm lawful basis, retention period, masking, encryption and access controls before collecting Aadhaar or other sensitive identity documents. Do not expose raw identity data in normal admin screens or logs.</div>`},
{title:"Product listings & moderation",body:`<div class="kicker">08 · Listings</div><h2>Shared product vs seller listing</h2><p>Keep catalogue identity separate from the commercial offer. A catalogue product describes what the item is; a seller listing describes how a particular seller sells it.</p><table><tr><th>Shared catalogue product</th><th>Seller listing</th></tr><tr><td>Name, description, brand, category, common attributes and product media.</td><td>Seller ID, catalogue product ID, seller SKU, selling price, stock, condition, dispatch details and approval status.</td></tr></table><h3>Required workflow</h3><ol><li>Seller chooses an existing approved catalogue product, or submits a new product for review.</li><li>Existing approved product selection reuses its product ID; it must not create a duplicate catalogue product.</li><li>New catalogue product remains pending until Admin approval.</li><li>Seller creates a listing against the catalogue product.</li><li>Each seller listing has its own independent approval status.</li><li>Rejected catalogue products and rejected listings must store a rejection reason.</li><li>Only approved, active listings from active sellers are visible and purchasable.</li></ol><h3>Variants, images & inventory</h3><ul><li>Support product variants where applicable (for example size, colour or storage capacity).</li><li>Store product images with ordering, alt text and primary-image designation.</li><li>Track stock at the correct level: listing or variant, not ambiguously at both.</li><li>Prevent checkout quantities from exceeding available stock; reserve/decrement stock consistently during order placement.</li></ul><div class="note"><b>Future setting:</b> Admin may enable automatic listing approval for trusted sellers. Keep it disabled by default and make the rule auditable.</div>`},
{title:"Shopping experience",body:`<div class="kicker">09 · Customer experience</div><h2>Discovery to cart</h2><h3>Customer-facing modules</h3><ul><li>Home page with category navigation, featured products, promotions and local discovery content.</li><li>Category pages with sorting, filters and pagination.</li><li>Search with keyword matching and a foundation for semantic search.</li><li>Product detail page with gallery, description, specifications, variant selection, price, availability and seller information.</li><li>Cart with quantity updates, stock validation, fee summary and remove/save actions.</li><li>Wishlist for signed-in customers.</li><li>Product sharing with referral attribution where a valid referral code/link is present.</li></ul><h3>Product detail requirements</h3><ul><li>Show only purchasable approved listings.</li><li>Display price and availability clearly; avoid showing stale inventory.</li><li>Validate selected variant before adding to cart.</li><li>Show delivery estimate only when it can be calculated reliably; otherwise show a neutral delivery-information message.</li><li>Provide clear return/cancellation policy links before checkout.</li></ul><div class="callout">SEO: use readable unique slugs, canonical URLs, metadata, structured product data where appropriate, image alt text and indexable category/product pages. Slugs must be unique and stable; handle slug changes with redirects.</div>`},
{title:"Checkout & payments",body:`<div class="kicker">10 · Checkout & payments</div><h2>Checkout, fees and payment modes</h2><h3>Checkout sequence</h3><ol><li>Customer selects or adds a delivery address.</li><li>Server revalidates listing status, variant, price and inventory.</li><li>Calculate item subtotal, delivery charges, marketplace fees, discounts/referral benefits and final payable amount.</li><li>Customer selects an enabled payment method.</li><li>Create a pending/initiated order and payment record with an idempotent reference.</li><li>Confirm payment through verified server-side provider response/webhook before marking paid.</li><li>For COD, create the order as COD pending/confirmed according to the agreed operational policy.</li></ol><h3>Payment requirements</h3><ul><li>Razorpay integration is the current planned/implemented gateway.</li><li>Admin can enable or disable COD through settings.</li><li>Never trust client-side payment success alone; verify signatures and webhook events.</li><li>Handle duplicate webhook delivery safely and make payment updates idempotent.</li><li>Record gateway order/payment IDs, amount, currency, status, failure reason and timestamps.</li><li>Refunds and payment reconciliation must be traceable.</li></ul><h3>Fee calculation</h3><p>Delivery fees and marketplace fees are configurable in Admin. The checkout must show a transparent itemized breakdown before the customer places the order.</p><div class="note"><b>Confirm before launch:</b> Decide whether the marketplace fee is charged to the customer, deducted from seller settlement, or split. Confirm GST treatment and rounding rules with the finance/tax owner.</div>`},
{title:"Orders & fulfilment",body:`<div class="kicker">11 · Orders & fulfilment</div><h2>Order lifecycle and delivery</h2><h3>Suggested order states</h3><p><span class="tag">Pending payment</span><span class="tag">Confirmed</span><span class="tag">Processing</span><span class="tag">Ready to ship</span><span class="tag">Shipped</span><span class="tag">Delivered</span><span class="tag">Cancelled</span><span class="tag">Return requested</span><span class="tag">Returned</span><span class="tag">Refunded</span></p><p>Define permitted transitions and responsible actor for each transition. Keep order status separate from payment status and shipment status.</p><h3>Delivery modes</h3><div class="grid"><div class="tile"><b>Shiprocket</b><p>Platform-managed aggregator integration for serviceability, shipment creation, AWB/courier assignment, label/manifest and tracking where supported.</p></div><div class="tile"><b>Manual courier / seller fulfilment</b><p>Authorized operator or seller enters courier name, tracking/AWB number, tracking URL and dispatch details. Seller API credentials, if used, must be encrypted and scoped.</p></div></div><h3>Shipment rules</h3><ul><li>Shipment creation is triggered when an order reaches the agreed dispatch-preparation state, not merely when a cart is checked out.</li><li>Store provider, shipment reference, AWB, courier, label, tracking URL, pickup and delivery timestamps.</li><li>Webhook endpoint must validate provider authenticity where supported, log events and process duplicates safely.</li><li>Map external tracking events to internal shipment/order states without allowing invalid backward transitions.</li><li>Provide a manual fallback when aggregator API is unavailable.</li><li>Never expose API secrets in frontend code, logs or error messages.</li></ul><div class="callout">Operational rule: cancellation, return, refund and return-pickup charges need explicit policies and must be reflected consistently in order, shipment and wallet ledgers.</div>`},
{title:"Referral & wallet",body:`<div class="kicker">12 · Referral & wallet</div><h2>Referral attribution and earnings</h2><p>The referral module rewards eligible referrals while preserving a clear ledger and configurable policy.</p><h3>Current business rules discussed</h3><ul><li>Generate a unique referral code/link for eligible users.</li><li>Lock referral attribution to the account at signup when a valid referral link/code is used.</li><li>Referral eligibility applies to qualifying orders for 365 days from attribution.</li><li>Activation threshold discussed: minimum shopping of ₹1,000; keep configurable in Admin.</li><li>Referral earnings are credited only after the return-policy window expires and the order is eligible.</li><li>Rates, threshold, duration, enable/disable switch and return-pickup charges are configurable.</li></ul><h3>Proposed split — requires final confirmation</h3><table><tr><th>Allocation</th><th>Discussed share</th><th>Basis to confirm</th></tr><tr><td>Referral</td><td>20%</td><td>Eligible final selling price</td></tr><tr><td>Company</td><td>30%</td><td>Eligible final selling price</td></tr><tr><td>Seller</td><td>50%</td><td>Eligible final selling price</td></tr></table><h3>Wallet requirements</h3><ul><li>Separate wallet accounts/ledger views for customer, seller and admin/company as applicable.</li><li>Use an append-only transaction ledger; do not rely only on a mutable balance field.</li><li>Support credit, debit, hold, release, reversal and withdrawal-request entries.</li><li>Withdrawal requests require status, amount, bank destination reference, review history and payout reference.</li><li>Prevent double-credit on repeated order/webhook processing.</li></ul><div class="note"><b>Critical clarification:</b> The 20/30/50 split must be defined against a precise amount (inclusive/exclusive of GST, discounts, delivery, refunds and platform fees). Do not hard-code it until the calculation basis is signed off.</div>`},
{title:"Invoices & finance",body:`<div class="kicker">13 · Finance & records</div><h2>Invoices, settlements and reconciliation</h2><h3>Invoice requirements</h3><ul><li>Generate an order invoice with invoice number, date, seller/business details, customer billing/shipping details, line items, quantities, taxable value, tax rates/amounts, delivery charges, discounts and total.</li><li>Support GST invoice fields where legally applicable, including GSTIN and place-of-supply details.</li><li>Use configurable company identity, address, support email/phone and invoice settings.</li><li>Store invoice snapshots so later profile changes do not silently rewrite historical invoices.</li><li>Allow authorized users to view/download invoices and preserve invoice numbering integrity.</li></ul><h3>Finance and reconciliation</h3><ul><li>Reconcile order totals with payment gateway captures, COD collections, refunds and wallet movements.</li><li>Track seller payable, platform revenue, delivery costs, referral liabilities and adjustments separately.</li><li>Record manual adjustments with reason, actor and timestamp.</li><li>Provide date-range reports and exportable operational/finance data.</li></ul><div class="callout">Tax configuration is not a substitute for tax advice. Confirm invoice issuer, GST registration responsibilities, e-invoicing applicability and settlement accounting with a qualified finance/tax professional.</div>`},
{title:"Admin panel & settings",body:`<div class="kicker">14 · Administration</div><h2>Admin control centre</h2><h3>Core admin modules</h3><div class="grid"><div class="tile"><b>Dashboard</b><p>Orders, revenue, active sellers, pending approvals and operational alerts.</p></div><div class="tile"><b>Users & roles</b><p>Customer/seller accounts, admin roles, permissions and account status.</p></div><div class="tile"><b>Catalogue</b><p>Categories, attributes, products, images, approvals and rejection reasons.</p></div><div class="tile"><b>Orders & shipments</b><p>Order status, shipment creation, tracking, exceptions, returns and refunds.</p></div><div class="tile"><b>Payments & finance</b><p>Gateway transactions, COD, invoices, wallets, withdrawals and reconciliation.</p></div><div class="tile"><b>Settings</b><p>Site identity, fees, payment modes, delivery integrations and referral policy.</p></div></div><h3>Settings baseline</h3><p>Include settings for site name/URL, support email/phone, business address, delivery fee, marketplace fee, COD enabled, Shiprocket enabled, manual delivery enabled, referral enabled, referral rates, attribution duration, activation threshold, return window and other approved operational controls.</p><h3>Admin security</h3><ul><li>Mandatory 2FA for all admin accounts.</li><li>Granular permissions for Sub Admins.</li><li>Audit log for approvals, price/fee changes, bank-detail changes, refunds and manual wallet adjustments.</li><li>Mask sensitive data and restrict document access.</li></ul>`},
{title:"Technical architecture",body:`<div class="kicker">15 · Technical architecture</div><h2>Implementation direction</h2><div class="grid"><div class="tile"><b>Backend</b><p>Laravel 13 application with server-side validation, policies, queues, scheduled jobs and API endpoints.</p></div><div class="tile"><b>Database</b><p>MySQL relational database with foreign keys, indexes, transactions and explicit status fields.</p></div><div class="tile"><b>Frontend</b><p>Responsive web UI using Blade and Tailwind CSS; Poppins is the preferred typeface.</p></div><div class="tile"><b>Infrastructure</b><p>Ubuntu VPS, Nginx, PHP 8.3 runtime, HTTPS, queue worker and scheduler.</p></div></div><h3>Architecture principles</h3><ul><li>Keep business logic in services/actions rather than duplicating it across controllers.</li><li>Use Form Requests for validation and Policies/Gates for authorization.</li><li>Use database transactions for checkout, stock updates, wallet posting and financial state changes.</li><li>Use queues for slow external calls, notifications and non-blocking work.</li><li>Use scheduled jobs for expiry, reconciliation reminders and routine cleanup.</li><li>Use environment variables or secret management for provider credentials; never commit secrets.</li><li>Keep provider integrations behind service classes/adapters so a delivery/payment provider can be changed.</li></ul><h3>Deployment environments</h3><p>Maintain separate local/development, staging and production configurations. Production must use HTTPS, backups, monitored queues, restricted database access and tested rollback procedures.</p>`},
{title:"Data model",body:`<div class="kicker">16 · Data requirements</div><h2>Core entities and relationships</h2><p>The following is a logical model, not a final migration specification. Existing project migrations and production data must be inspected before changing table structures.</p><table><tr><th>Domain</th><th>Core entities (indicative)</th></tr><tr><td>Identity</td><td>users, roles, permissions, seller_profiles, seller_documents, addresses</td></tr><tr><td>Catalogue</td><td>categories, products, product_images, product_variants, attributes, attribute_values</td></tr><tr><td>Seller offer</td><td>seller_listings, listing_variants, inventory/stock records, seller SKU</td></tr><tr><td>Shopping</td><td>carts, cart_items, wishlists, wishlist_items</td></tr><tr><td>Commerce</td><td>orders, order_items, order_addresses, order_status_history</td></tr><tr><td>Payments</td><td>payments, payment_webhook_events, refunds, invoices</td></tr><tr><td>Fulfilment</td><td>shipments, shipment_events, courier/provider references</td></tr><tr><td>Referral & wallet</td><td>referrals, referral_attributions, wallets, wallet_transactions, withdrawal_requests</td></tr><tr><td>Platform</td><td>admin_settings, audit_logs, notifications</td></tr></table><h3>Data integrity requirements</h3><ul><li>Use foreign keys and indexes for lookup/join fields.</li><li>Use unique constraints for slugs, referral codes, seller SKU within its defined scope, invoice numbers and provider event IDs where appropriate.</li><li>Use decimal types for money; never floating-point arithmetic for currency.</li><li>Store timestamps consistently and configure the application timezone to Asia/Kolkata for display/business scheduling.</li><li>Preserve historical snapshots for order item names, prices, tax and addresses.</li><li>Use soft deletes only where they do not compromise financial/audit history.</li></ul>`},
{title:"API & integrations",body:`<div class="kicker">17 · APIs & integrations</div><h2>Integration requirements</h2><h3>Internal API conventions</h3><ul><li>Use versioned, authenticated endpoints for mobile/client integrations where applicable.</li><li>Return consistent success/error structures and appropriate HTTP status codes.</li><li>Validate ownership and role access on every protected endpoint.</li><li>Use pagination for list endpoints and rate-limit OTP/authentication routes.</li><li>Use idempotency keys or provider event IDs for payment/shipment callbacks.</li></ul><h3>External services</h3><table><tr><th>Integration</th><th>Purpose</th><th>Required handling</th></tr><tr><td>Razorpay</td><td>Online payment collection</td><td>Signature verification, webhook validation, retries, refunds and reconciliation.</td></tr><tr><td>Shiprocket</td><td>Shipping aggregation</td><td>Authentication, serviceability, shipment/AWB creation, tracking and webhook events.</td></tr><tr><td>Manual courier</td><td>Fallback fulfilment</td><td>Courier/tracking details, status updates and audit history.</td></tr><tr><td>OTP provider</td><td>Mobile verification/login</td><td>Rate limits, expiry, attempt limits and delivery failure handling.</td></tr></table><h3>Webhook endpoint checklist</h3><ul><li>HTTPS only; verify signature/token according to provider documentation.</li><li>Persist the raw event safely (redact secrets/PII) and return success quickly after durable receipt.</li><li>Process asynchronously where appropriate; deduplicate by provider event ID.</li><li>Handle out-of-order and repeated events; never blindly overwrite a later valid state.</li><li>Monitor failures and provide a safe replay/reconciliation mechanism.</li></ul>`},
{title:"Security & compliance",body:`<div class="kicker">18 · Security</div><h2>Non-negotiable safeguards</h2><ul><li>Enforce authentication, authorization and ownership checks on the server.</li><li>Use CSRF protection for browser forms, output escaping and strict input validation.</li><li>Use secure password hashing, OTP expiry/attempt limits and admin 2FA.</li><li>Encrypt provider credentials and sensitive identity/bank data at rest where appropriate.</li><li>Use HTTPS in all environments that handle real user data.</li><li>Keep secrets out of source control, frontend bundles, logs and error responses.</li><li>Apply least-privilege access to database, filesystem, admin roles and production server.</li><li>Back up database and uploaded files; test restore, not just backup creation.</li><li>Log security-relevant events without recording passwords, OTPs, full payment credentials or unnecessary identity data.</li><li>Define retention, consent, privacy policy, terms, cancellation/return policy and grievance/support process before launch.</li></ul><h3>Operational resilience</h3><p>External API outages must not corrupt orders or payments. Use timeouts, retries with backoff, circuit-breaker-like safeguards where appropriate, queued jobs and manual fallback procedures.</p><div class="callout">Do not treat a successful HTTP response as proof that a payment or shipment is complete. Verify provider state and persist a traceable internal event.</div>`},
{title:"Non-functional requirements",body:`<div class="kicker">19 · Quality attributes</div><h2>Performance, reliability and usability</h2><table><tr><th>Area</th><th>Requirement</th><th>How to verify</th></tr><tr><td>Responsive UX</td><td>Core shopping and admin flows usable on desktop, tablet and mobile.</td><td>Test common viewport sizes and real devices.</td></tr><tr><td>Performance</td><td>Paginate large lists, optimize images, index frequent queries and cache safe read-heavy data.</td><td>Measure page/API response times under representative load.</td></tr><tr><td>Reliability</td><td>Checkout and financial updates must be transaction-safe and idempotent.</td><td>Retry, duplicate-event and concurrency tests.</td></tr><tr><td>Availability</td><td>Backups, monitoring, queue supervision and documented recovery steps.</td><td>Restore drill and failure simulation.</td></tr><tr><td>Accessibility</td><td>Keyboard-accessible controls, visible focus, labels and adequate contrast.</td><td>Manual accessibility review and automated checks.</td></tr><tr><td>Maintainability</td><td>Modular services, tests, migrations and documented configuration.</td><td>Code review and CI test suite.</td></tr><tr><td>SEO</td><td>Unique metadata, canonical URLs, sitemap, robots rules and structured data where relevant.</td><td>Search-console and crawler checks.</td></tr></table><h3>Suggested release gates</h3><ul><li>No unresolved critical/high security defects.</li><li>No known payment/order/stock duplication defects.</li><li>Production backup restore successfully tested.</li><li>Core user journeys pass on mobile and desktop.</li><li>Provider webhooks and manual fallback tested in staging.</li></ul>`},
{title:"Acceptance criteria & roadmap",body:`<div class="kicker">20 · Delivery plan</div><h2>Acceptance criteria & next steps</h2><h3>V1 acceptance checklist</h3><ul><li>Admin can create/activate sellers and review verification documents.</li><li>Seller can select only active approved categories.</li><li>Existing catalogue product selection reuses the same product record.</li><li>New catalogue products and seller listings follow their separate approval workflows.</li><li>Rejected records retain clear reasons and review history.</li><li>Customer can search/browse, view a product, manage cart/wishlist and complete checkout.</li><li>Payment status is based on verified provider events; COD obeys admin setting.</li><li>Order, payment and shipment statuses remain independently traceable.</li><li>Shiprocket and manual fulfilment paths can both be operated and audited.</li><li>Referral and wallet credits are ledger-based, delayed until eligibility is confirmed and protected against duplicate posting.</li><li>Invoices preserve historical transaction details.</li><li>Admin settings, permissions, 2FA and audit logs work as specified.</li></ul><h3>Suggested implementation sequence</h3><ol><li><b>Foundation:</b> roles/permissions, seller profiles, settings, categories and audit logging.</li><li><b>Catalogue:</b> products, attributes, images, variants, listing moderation and inventory.</li><li><b>Shopping:</b> home/category/search, product detail, cart and wishlist.</li><li><b>Commerce:</b> checkout, fee calculation, payment gateway and COD.</li><li><b>Fulfilment:</b> order lifecycle, Shiprocket, manual courier and webhooks.</li><li><b>Finance:</b> invoices, wallet ledger, referral rules, withdrawals and reconciliation.</li><li><b>Hardening:</b> security, performance, SEO, backups, QA and production release.</li></ol><div class="rule"></div><h3>Open decisions requiring sign-off</h3><ol><li>Confirm V1 single-seller operating model and exact multi-vendor activation criteria.</li><li>Confirm who bears marketplace fees and delivery charges, including tax treatment.</li><li>Approve the 20/30/50 referral split basis and the return/eligibility window.</li><li>Confirm seller settlement frequency, withdrawal approval and payout process.</li><li>Confirm return, cancellation, refund and return-pickup charge policies.</li><li>Confirm whether seller-specific API credentials are needed in V1 or manual tracking is sufficient.</li><li>Confirm OTP provider, notification channels, privacy/retention policy and legal documents.</li></ol><div class="callout"><b>End of baseline PRD.</b> Treat changes to these rules as controlled requirement changes: record the decision, owner, date, affected modules and migration/API impact before implementation.</div>`}
];

let current = 0;
const pageEl = document.getElementById('page');
const tocEl = document.getElementById('toc');
function render(){
  const p = pages[current];
  pageEl.className = 'page' + (p.cover ? ' cover' : '');
  pageEl.innerHTML = p.body + (p.cover ? '' : `<div class="footer"><span>CRAZYCHILL.IN · PROJECT REQUIREMENT DOCUMENT</span><span>${String(current+1).padStart(2,'0')} / ${pages.length}</span></div>`);
  document.getElementById('chapterLabel').textContent = p.title;
  document.getElementById('progressText').textContent = `${current+1} / ${pages.length}`;
  document.getElementById('pageIndicator').textContent = `Page ${current+1} of ${pages.length}`;
  document.getElementById('progress').style.width = `${((current+1)/pages.length)*100}%`;
  document.getElementById('prev').disabled = current===0;
  document.getElementById('next').disabled = current===pages.length-1;
  [...tocEl.querySelectorAll('button')].forEach((b,i)=>b.classList.toggle('active',i===current));
  const active = tocEl.querySelector('.active'); if(active && window.innerWidth<900) active.scrollIntoView({block:'nearest'});
}
pages.forEach((p,i)=>{
  const li=document.createElement('li'); const b=document.createElement('button');
  b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span>${p.title}`;
  b.addEventListener('click',()=>{current=i;render();});
  li.appendChild(b);tocEl.appendChild(li);
});
function turn(dir){const next=current+dir;if(next<0||next>=pages.length)return;current=next;render();}
function toggleIndex(){const s=document.getElementById('sidebar');s.style.display=s.style.display==='none'?'':'none';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')turn(1);if(e.key==='ArrowLeft')turn(-1);});
let touchX=null;
pageEl.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});
pageEl.addEventListener('touchend',e=>{if(touchX===null)return;const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>55)turn(dx<0?1:-1);touchX=null},{passive:true});
render();
</script>
</body>
